<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureLogin | Sign in</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card">
    <div class="mark">SL</div>
    <p class="eyebrow">SECURE AUTHENTICATION</p>
    <h1>Welcome back</h1><p class="muted">Sign in to your SecureLogin account.</p>
    <p class="notice" th:if="${param.error}">Invalid username or password.</p>
    <p class="success" th:if="${param.logout}">You have signed out.</p>
    <p class="success" th:if="${param.registered}">Account created. You can now sign in.</p>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Username</label><input name="username" autocomplete="username" required minlength="3" maxlength="50">
  
        <label>Password</label><input type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign in securely</button>
    </form>
    <p class="foot">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body></html>
