<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureLogin | Create account</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card">
    <div class="mark">SL</div><p class="eyebrow">JOIN SECURELOGIN</p>
    <h1>Create account</h1><p class="muted">Use a unique password of at least 12 characters.</p>
    <p class="notice" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/register}" th:object="${form}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Username</label><input th:field="*{username}" required minlength="3" maxlength="50">
        <small class="field-error" th:errors="*{username}"></small>
        <label>Email</label><input type="email" th:field="*{email}" required maxlength="120">
        <small class="field-error" th:errors="*{email}"></small>
        <label>Password</label><input type="password" th:field="*{password}" required minlength="12" maxlength="72">
        <small class="field-error" th:errors="*{password}"></small>
        <button type="submit">Create account</button>
    </form>
    <p class="foot">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body></html>
