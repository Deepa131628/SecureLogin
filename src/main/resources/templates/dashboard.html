<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SecureLogin | Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card wide">
    <div class="mark">SL</div><p class="eyebrow">USER PORTAL</p>
    <h1>Your dashboard</h1>
    <p class="muted">You are authenticated. This protected page is available only after login.</p>
    <div class="panel"><strong>Account status</strong><p class="success">Authenticated session active</p></div>
    <form method="post" th:action="@{/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="secondary" type="submit">Sign out</button>
    </form>
</main>
</body></html>
